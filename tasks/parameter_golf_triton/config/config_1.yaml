llm:
  name: "gemini-3.1-pro-preview"
  client_type: "gemini"
  context_size: 500000
  safety_margin: 600
  max_try_count: 5

experiment:
  max_iters: 500
  task_id: "parameter_golf_triton"
  max_hparam_iters: 0
  sota_algo_name: "PARAMETER_GOLF_TRITON"
  initial_baseline_id: -1
  num_cpu_cores: 32

paths:
  data_path: "~/pacevolve/tasks/parameter_golf/data/datasets/fineweb10B_sp1024"
  tokenizer_path: "~/pacevolve/tasks/parameter_golf/data/tokenizers/fineweb_1024_bpe.model"
  src_path: "~/pacevolve/tasks/parameter_golf_triton/src"
  eval_path: "~/pacevolve/tasks/parameter_golf_triton/eval"
  results_path: "~/pacevolve/tasks/parameter_golf_triton/results"
  target_file_path: "train_gpt.py"
  log_dir: "~/pacevolve/tasks/parameter_golf_triton/verbose"
  transcript_dir: "~/pacevolve/tasks/parameter_golf_triton/transcripts"

compilation:
  recompile_timeout: 60
  recompile_max_retries: 2
  conda_env: "pgolf"
  edit_start_tag: "RegexTagCustomPruningAlgorithmStart"
  edit_end_tag: "RegexTagCustomPruningAlgorithmEnd"

candidate_validation:
  max_retries: 2

evaluation:
  eval_timeout: 900
  eval_max_retries: 1
  eval_script_name: "run.sh"
  nproc_per_node: 8
  max_parallel_evals: 1
  target_score: 1.0
  init_score: 1.5
  metric_direction: "min"
  eval_configs:
    - dataset: "fineweb_sp1024"

database:
  num_islands: 4
  tournament_size: 2
  top_k: 4
  max_queue_size: 100

workflow_loops:
  initial_compile:
    max_attempts: 3
    loop_tag: "initial_compile_loop"
    summary_tag: "initial_compile_summary"
  initial_eval:
    max_attempts: 2
    max_compile_attempts: 4
    loop_tag: "initial_eval_loop"
    summary_tag: "initial_eval_summary"
    compile_loop_tag: "compile_within_eval_loop"
    compile_summary_tag: "compile_summary"

summarization:
  context_lines_after_error: 3
  max_lines_fallback: 40
  max_summary_lines: 60
